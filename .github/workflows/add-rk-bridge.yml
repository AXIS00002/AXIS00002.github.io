name: Add Rakuten userscript bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-rk-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert postMessage bridge
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = """        showSuccess(
          `获取完成：API 返回 ${rawCount} 条，去重后 ${products.length} 件。\\n` +
          `已包含商品管理番号、商品 URL、主图和 API 商品说明。`
        );"""

          bridge = marker + """

        window.postMessage(
          {
            type: 'RK_CHECK_PRODUCTS',
            sourceName: '楽天商品API',
            items: products
          },
          window.location.origin
        );"""

          if "type: 'RK_CHECK_PRODUCTS'" in text:
              print('Bridge already present; no change needed.')
          elif marker not in text:
              raise SystemExit('Target success block was not found.')
          else:
              path.write_text(text.replace(marker, bridge, 1), encoding='utf-8')

      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Rakuten API results to userscript"
          git push
