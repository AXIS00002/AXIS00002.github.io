09:12","09:28"],"answer":0,"explanation":"10:02 报告已解决。","stimulus":"Message Board — Customer Support Team\n\n09:05 Hana: The ticketing website is currently displaying an error during checkout.\n09:12 Ben: I have informed the engineering team. They are investigating the payment gateway.\n09:28 Hana: Should we post a notice on the homepage?\n09:31 Ben: Yes, please. Let customers know that existing reservations are unaffected.\n10:02 Ben: Engineering has resolved the issue. New payments are working normally.","difficulty":"中等","topic":"客服","scene":"","group":"p7g","audioText":""}],"vocab":[{"id":"v1","word":"agenda","meaning":"议程","example":"Please review the agenda before the meeting.","category":"会议"},{"id":"v2","word":"deadline","meaning":"截止期限","example":"We must meet the Friday deadline.","category":"项目"},{"id":"v3","word":"invoice","meaning":"发票","example":"The invoice was sent by email.","category":"财务"},{"id":"v4","word":"shipment","meaning":"一批货物；运输","example":"The shipment arrived ahead of schedule.","category":"物流"},{"id":"v5","word":"inventory","meaning":"库存清单","example":"The inventory is updated every Monday.","category":"物流"},{"id":"v6","word":"postpone","meaning":"推迟","example":"They decided to postpone the meeting.","category":"会议"},{"id":"v7","word":"reimburse","meaning":"报销","example":"The company will reimburse travel expenses.","category":"财务"},{"id":"v8","word":"proposal","meaning":"提案","example":"She submitted a project proposal.","category":"项目"},{"id":"v9","word":"confirm","meaning":"确认","example":"Please confirm your reservation.","category":"商务"},{"id":"v10","word":"notify","meaning":"通知","example":"We will notify you of any changes.","category":"商务"},{"id":"v11","word":"refund","meaning":"退款","example":"The customer requested a full refund.","category":"客服"},{"id":"v12","word":"complimentary","meaning":"免费的；赠送的","example":"The hotel provides a complimentary shuttle.","category":"旅游"},{"id":"v13","word":"approximately","meaning":"大约","example" edule is subject to change.","category":"商务"},{"id":"v50","word":"ahead of schedule","meaning":"提前完成","example":"The project finished ahead of schedule.","category":"项目"}]};

  <script>
/* TOEIC Studio — browser-only learning application. All bundled exercises are original. */
(() => {
'use strict';
const SEED = window.TOEIC_SEED || {questions:[],vocab:[]};
const KEY = 'toeic-studio-state-v1';
const PARTS = {1:['照片描述','Photographs','听力'],2:['应答问题','Question–Response','听力'],3:['对话理解','Conversations','听力'],4:['简短独白','Talks','听力'],5:['短句填空','Incomplete Sentences','阅读'],6:['长文填空','Text Completion','阅读'],7:['阅读理解','Reading Comprehension','阅读']};
const OFFICIAL = {1:6,2:25,3:39,4:30,5:30,6:16,7:54};
const NAMES = {dashboard:'学习概览',practice:'分题型训练',mock:'模拟考试',vocab:'高频词汇',wrong:'错题本',bank:'题库与更新',settings:'学习设置'};
const root = document.getElementById('view-root');
const defaultState = {goal:800,examDate:'',sessionCount:10,selectedPart:0,history:[],wrong:[],bookmarks:[],wordReview:{},remoteQuestions:[],manualQuestions:[],updateUrl:'https://raw.githubusercontent.com/AXIS00002/AXIS00002.github.io/main/toeic/data/updates.json',lastUpdated:null,lastCheck:null,bankError:'',bankVersion:'1.0.0'};
let state = loadState();
let view = 'dashboard', session = null, result = null, timerInterval = null, currentWordIndex = 0, isWordFlipped = false, wordQueue = [], wordCompleted = 0, isUpdating = false;
let allQuestions = [];
rebuildQuestions();
const $ = (sel) => document.querySelector(sel);
function loadState(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');return {...defaultState,...saved,history:Array.isArray(saved.history)?saved.history:[],wrong:Array.isArray(saved.wrong)?saved.wrong:[],bookmarks:Array.isArray(saved.bookmarks)?saved.bookmarks:[],wordReview:saved.wordReview&&typeof saved.wordReview==='object'?saved.wordReview:{},remoteQuestions:Array.isArray(saved.remoteQuestions)?saved.remoteQuestions:[],manualQuestions:Array.isArray(saved.manualQuestions)?saved.manualQuestions:[]};}catch{return {...defaultState};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(err){console.warn('Cannot save to localStorage',err);}}
function esc(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dateAdd(days){const d=new Date();d.setDate(d.getDate()+days);return dateKey(d);}
function fmtDate(s){if(!s)return '尚未更新';const d=new Date(s);return isNaN(d)?String(s):d.toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function formatTimer(seconds){let s=Math.max(0,Math.floor(seconds||0));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function randSort(arr){const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function rebuildQuestions(){const seen=new Set();allQuestions=[];for(const q of [...SEED.questions,...state.remoteQuestions,...state.manualQuestions]){if(!q||seen.has(q.id))continue;seen.add(q.id);allQuestions.push(q);}}
function questionOK(q){return !!(q&&typeof q.id==='string'&&q.id.length<120&&Number.isInteger(q.part)&&q.part>=1&&q.part<=7&&typeof q.question==='string'&&q.question.length>5&&q.question.length<600&&Array.isArray(q.options)&&q.options.length===(q.part===2?3:4)&&q.options.every(o=>typeof o==='string'&&o.length>0&&o.length<800)&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length&&typeof q.explanation==='string'&&q.explanation.length>3&&q.explanation.length<2000&&(!q.stimulus||typeof q.stimulus==='string'&&q.stimulus.length<6000)&&(!q.audioText||typeof q.audioText==='string'&&q.audioText.length<6000));}
function byPart(p){return allQuestions.filter(q=>q.part===Number(p));}
function attemptStats(){const n=state.history.length,c=state.history.filter(h=>h.correct).length,today=state.history.filter(h=>h.day===dateKey()).length;return {n,c,today,rate:n?Math.round(c/n*100):0};}
function dayStreak(){const used = new Set(state.history.map(h=>h.day).concat(Object.values(state.wordReview).map(v=>v.lastDay).filter(Boolean)));let day = new Date();if(!used.has(dateKey(day))){day.setDate(day.getDate()-1);if(!used.has(dateKey(day)))return 0;}let count=0;while(used.has(dateKey(day))){count++;day.setDate(day.getDate()-1);}return count;}
function dailyStats(){const result=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const day=dateKey(d);result.push({day,label:['日','一','二','三','四','五','六'][d.getDay()],n:state.history.filter(h=>h.day===day).length,today:i===0});}return result;}
function countDue(){return SEED.vocab.filter(v=>!state.wordReview[v.id]||state.wordReview[v.id].due<=dateKey()).length;}
function toast(message){const host=$('#toast-region');const el=document.createElement('div');el.className='toast';el.textContent=message;host.appendChild(el);setTimeout(()=>el.remove(),3700);}
function title(eyebrow,heading,subtitle='',end=''){return `<div class="page-eyebrow">${esc(eyebrow)}</div><div class="page-heading"><div><h1>${esc(heading)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div>${end}</div>`;}
function button(label,action,klass='btn-outline',extra=''){return `<button class="btn ${klass}" data-action="${esc(action)}" ${extra}>${label}</button>`;}
function nav(name){if(!(name in NAMES))name='dashboard';view=name;render();for(const el of document.querySelectorAll('[data-nav]'))if(el.classList.contains('nav-item'))el.classList.toggle('active',el.dataset.nav===name);$('#view-title').textContent=NAMES[name];$('#sidebar').classList.remove('open');$('#mobile-backdrop').classList.remove('show');window.scrollTo({top:0,behavior:'instant'});}
function showView(name){nav(name);if(location.hash!=='#'+name)location.hash=name;}
function updateSidebar(){const el=$('#wrong-count');if(el)el.textContent=state.wrong.length;$('#today-label').textContent=new Date().toLocaleDateString('zh-CN',{month:'short',day:'numeric',weekday:'short'});}
function render(){updateSidebar();let content='';try{switch(view){case'dashboard':content=renderDashboard();break;case'practice':content=session&&session.mode==='practice'?renderSession():result&&result.mode==='practice'?renderResult():renderPractice();break;case'mock':content=session&&session.mode==='mock'?renderSession():result&&result.mode==='mock'?renderResult():renderMock();break;case'vocab':content=renderVocab();break;case'wrong':content=session&&session.mode==='wrong'?renderSession():result&&result.mode==='wrong'?renderResult():renderWrong();break;case'bank':content=renderBank();break;case'settings':content=renderSettings();break;default:content=renderDashboard();}root.innerHTML=content;}catch(e){console.error(e);root.innerHTML='<div class="empty-state"><h3>显示出错</h3><p>请刷新页面重试，已经保存的学习数据不会主动删除。</p></div>';}}
function renderDashboard(){const a=attemptStats(),weekly=dailyStats(),max=Math.max(5,...weekly.map(x=>x.n));const p5=state.history.filter(h=>h.part===5), listening=state.history.filter(h=>h.part<=4),reading=state.history.filter(h=>h.part>=5),perc=xs=>xs.length?Math.round(xs.filter(h=>h.correct).length/xs.length*100):0;const todayGoal=Math.min(100,Math.round(a.today/10*100));return `${title('YOUR LEARNING DASHBOARD','你好，今天也向目标前进一步。','掌握自己的节奏，每一次练习都算数。',`<span class="date-quiet">${esc(new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}))}</span>`)}
<div class="hero"><div class="hero-main"><span class="hero-pill"><span></span> YOUR NEXT MILESTONE</span><h2>把今天的 10 道题，<br>变成明天的底气。</h2><p>从薄弱项开始突破，让每一次练习都有明确的方向。</p>${button('开始今日训练 <span>↗</span>','daily','btn-mint')}</div><div class="hero-art"><div class="score-orbit"><small>目标分数</small><strong>${esc(state.goal)}</strong><span>TOEIC L&R</span></div></div></div>
<div class="summary-grid">
  ${stat('今日已练习',a.today,'题','◷','purple')}
  ${stat('累计答题',a.n,'题','▤','mint')}
  ${stat('答题正确率',a.rate,'%','◎','amber')}
  ${stat('连续学习',dayStreak(),'天','✦','blue')}
</div>
<div class="dashboard-bottom">
 <section class="surface"><div class="surface-title"><h3>最近 7 天学习情况</h3><small>答题次数 / 天</small></div><div class="week-bars">${weekly.map(w=>`<div class="week-col ${w.today?'today':''}" title="${w.day}: ${w.n} 题"><div class="bar-track"><div class="bar-fill" style="height:${Math.max(2,w.n/max*100)}%"></div></div><div class="week-label">周${w.label}</div></div>`).join('')}</div><div class="surface-foot">数据仅储存在本浏览器。今天已完成 ${a.today}/10 题，进度 ${todayGoal}%。</div></section>
 <section class="surface"><div class="surface-title"><h3>能力表现</h3><small>基于实际练习正确率</small></div>${progressLine('Listening',listening.length?perc(listening):0,'listening')}${progressLine('Reading',reading.length?perc(reading):0,'reading')}${progressLine('Part 5',p5.length?perc(p5):0,'reading')}<div class="surface-foot">未练习时显示 0%，不代表实际能力评估。</div></section>
</div>
<div class="section-head"><h2>今天想练什么？</h2><span class="mini-note">按自己的时间安排学习</span></div><div class="action-grid">
 ${actionCard('◉','green','按题型专项练习','集中攻克 Part 1–7 的薄弱题型。','practice')}
 ${actionCard('◷','purple','20 题限时模拟','在考试节奏中提高答题稳定性。','mock')}
 ${actionCard('▤','orange','高频商务词汇',`当前 ${countDue()} 词待复习，强化核心词组。`,'vocab')}
</div>`;}
function stat(label,value,unit,icon,color){return `<div class="stat-card"><div class="stat-top"><span class="stat-title">${label}</span><span class="stat-icon ${color}">${icon}</span></div><span class="stat-number">${value}</span><span class="stat-unit">${unit}</span></div>`;}
function progressLine(name,pct,kind){return `<div class="part-line ${kind}"><span class="part-name">${name}</span><div class="progress-track"><span style="width:${pct}%"></span></div><span class="part-percent">${pct}%</span></div>`;}
function actionCard(icon,color,name,subtitle,target){return `<button class="action-card" data-nav="${target}"><span class="action-icon ${color}">${icon}</span><strong>${name}</strong><p>${subtitle}</p><span class="arrow">↗</span></button>`;}

<section class="surface"><div class="surface-title"><h3>隐私与数据</h3></div><p class="bank-description">目前没有用户账号和云端学习进度同步。答题记录只存于当前浏览器 localStorage，不会主动上传至服务器。请定期导出备份；清空浏览器网站数据会丢失本地记录。</p><div class="divider"></div><p class="muted">界面 / 解析语言：简体中文<br>题目语言：英语<br>听力：设备浏览器的英语语音引擎</p><div style="margin-top:18px">${button('清空全部学习记录','clear-progress','btn-outline')}</div></section></div>`;}
function daysUntil(input){const date=new Date(input+'T12:00:00');const now=new Date();const days=Math.ceil((date-now)/86400000);return days>=0?`${days} 天`:`已过去 ${Math.abs(days)} 天`;}
function speak(text){if(!('speechSynthesis'in window)){toast('此浏览器不支持语音合成，请使用新版 Chrome/Edge/Safari');return;}const engine=window.speechSynthesis;engine.cancel();const utter=new SpeechSynthesisUtterance(String(text||''));utter.lang='en-US';utter.rate=.9;utter.pitch=1;utter.volume=1;const voices=engine.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en'));if(voices.length)utter.voice=voices.find(v=>v.lang==='en-US')||voices[0];engine.speak(utter);}
function audioText(q){if(q.part===1)return q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join(' ');if(q.part===2)return `${q.stimulus} ${q.options.map((o,i)=>`${String.fromCharCode(65+i)}. ${o}`).join(' ')}`;if(q.audioText)return q.audioText;return q.stimulus||q.question;}
function download(name,text,type='application/json'){const blob=new Blob([text],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);}
async function readJSON(file){if(!file)return null;if(file.size>10*1024*1024)throw new Error('文件超过 10 MB 限制');return JSON.parse(await file.text());}
function importQuestions(data){const arr=Array.isArray(data)?data:data&&Array.isArray(data.questions)?data.questions:null;if(!arr)throw new Error('题库应为 JSON 数组或包含 questions 数组的对象');const existing=new Set(allQuestions.map(q=>q.id));const additions=[];let invalid=0,dup=0;for(const q of arr){if(!questionOK(q)){invalid++;continue;}if(existing.has(q.id)){dup++;continue;}additions.push(q);existing.add(q.id);}state.manualQuestions=[...state.manualQuestions,...additions].slice(-5000);rebuildQuestions();save();return {added:additions.length,invalid,dup};}
async function refreshBank(silent=false){if(isUpdating)return;if(location.protocol==='file:'){if(!silent)toast('本地 file:// 模式暂不能自动抓取新题；部署到 HTTPS 后即可');return;}isUpdating=true;state.lastCheck=new Date().toISOString();const url=(state.updateUrl||'./data/updates.json').trim();try{const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),13000);let response;try{response=await fetch(url,{cache:'no-store',signal:ctrl.signal});}finally{clearTimeout(timeout);}if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();const arr=Array.isArray(data)?data:data.questions;if(!Array.isArray(arr))throw new Error('题库缺少 questions 数组');const existing=new Set([...SEED.questions,...state.manualQuestions,...state.remoteQuestions].map(q=>q.id));let added=0,invalid=0;for(const q of arr){if(!questionOK(q)){invalid++;continue;}if(existing.has(q.id))continue;state.remoteQuestions.push(q);existing.add(q.id);added++;}state.remoteQuestions=state.remoteQuestions.slice(-5000);state.bankVersion=esc(data.version||state.bankVersion);state.lastUpdated=data.generatedAt||state.lastUpdated||null;state.bankError='';rebuildQuestions();save();if(!silent)toast(`已完成题库检查：新增 ${added} 题${invalid?`，跳过 ${invalid} 条无效记录`:''}`);}catch(err){state.bankError=String(err?.message||err);save();if(!silent)toast(`更新失败：${state.bankError}`);}finally{isUpdating=false;if(view==='bank')render();}}
function saveSettings(){const val=Number($('#score-goal')?.value);if(!Number.isInteger(val)||val<10||val>990||val%5!==0){toast('请输入 10–990 之间、以 5 分为步长的目标分');return;}state.goal=val;state.examDate=$('#exam-date')?.value||'';save();toast('学习目标已保存');render();}

let extra='';switch(name){case'warehouse':extra=`<rect x="83" y="27" width="280" height="176" rx="5" fill="#9bb2b9"/><rect x="92" y="36" width="262" height="158" fill="#e9f0ee"/><path d="M95 86H352M95 145H352" stroke="#859da6" stroke-width="9"/><g fill="#d8ac75"><rect x="115" y="50" width="60" height="30" rx="2"/><rect x="190" y="49" width="51" height="30" rx="2"/><rect x="118" y="109" width="48" height="31" rx="2"/><rect x="251" y="110" width="67" height="30" rx="2"/></g>${person(432,87)}<rect x="382" y="122" width="64" height="48" fill="#d8ac75"/><path d="M415 122v47" stroke="#bc9060" stroke-width="3"/>`;break;
case'meeting':extra=`<rect x="212" y="26" width="242" height="120" rx="5" fill="#304961"/><rect x="222" y="36" width="222" height="100" fill="#d9f3ea"/><path d="M241 100L296 71l56 22 57-37" stroke="#69b69c" fill="none" stroke-width="6"/><rect x="120" y="165" width="440" height="40" rx="16" fill="#b18c73"/><path d="M150 204v40m380-40v40" stroke="#80634f" stroke-width="10"/>${person(153,81,'#879bd0')}${person(336,91,'#c7a26c')}${person(513,86,'#55a1a0')}`;break;
case'cafe':extra=`<rect x="64" y="35" width="260" height="110" rx="6" fill="#d9e8dd"/><path d="M77 48H310" stroke="#9caea6" stroke-width="8"/><rect x="48" y="160" width="575" height="36" rx="8" fill="#b7896d"/>${person(164,65,'#4e7e69')}${person(453,74,'#6c83a1')}<path d="M245 124h34v39h-34z" fill="#fff"/><path d="M248 125h28" stroke="#946a47" stroke-width="6"/>`;break;
case'office':extra=`<rect x="74" y="28" width="210" height="140" fill="#c5dce5"/><path d="M179 28v140M74 96h210" stroke="#e8f6f7" stroke-width="9"/><circle cx="210" cy="58" r="19" fill="#f8d9a5"/><rect x="300" y="150" width="290" height="31" rx="5" fill="#b58d6e"/><rect x="348" y="90" width="120" height="78" rx="6" fill="#405e76"/><rect x="358" y="100" width="100" height="55" fill="#a6dacf"/>${person(499,89,'#8d84b7')}<path d="M520 170h25l15 38h-55z" fill="#6a7d9b"/>`;break;
case'station':extra=`<rect x="28" y="45" width="398" height="145" rx="21" fill="#8ac2cb"/><rect x="42" y="60" width="370" height="80" rx="11" fill="#d6eff0"/><path d="M162 60v80m130-80v80" stroke="#8ac2cb" stroke-width="10"/><path d="M27 163h398" stroke="#527f96" stroke-width="17"/><circle cx="120" cy="191" r="14" fill="#344356"/><circle cx="327" cy="191" r="14" fill="#344356"/>${person(503,93,'#806fa6')}${person(583,89,'#52818d')}`;break;
case'delivery':extra=`<rect x="74" y="38" width="250" height="150" rx="7" fill="#c9d7e0"/><path d="M80 84h236M80 135h236" stroke="#91aab8" stroke-width="7"/><g fill="#d8b18a"><rect x="96" y="50" width="67" height="28"/><rect x="188" y="99" width="83" height="30"/><rect x="112" y="146" width="90" height="36"/></g>${person(439,82,'#548d89')}<rect x="480" y="121" width="29" height="43" rx="3" fill="#344e67"/><rect x="485" y="129" width="19" height="22" fill="#a5d9cd"/><rect x="365" y="162" width="70" height="40" fill="#d6aa78"/>`;break;default:extra=person(325,80);}
return start+extra+end;}
function onAction(name,el){
 switch(name){
  case 'daily':state.selectedPart=0;save();startSession('practice',selectQuestions(10));break;
  case 'go-practice':showView('practice');break;
  case 'go-wrong':showView('wrong');break;
  case 'set-scope':state.selectedPart=el.dataset.scope==='0'?0:el.dataset.scope;save();render();break;
  case 'select-part':{const n=Number(el.dataset.part);state.selectedPart=state.selectedPart===n?0:n;save();render();break;}
  case 'start-practice':{const p=state.selectedPart;const items=selectQuestions(Number(state.sessionCount)||10,p);startSession('practice',items);break;}
  case 'start-mock-short':startSession('mock',mockQuestions(false),20*60);break;
  case 'start-mock-full':{if(!Object.keys(OFFICIAL).every(p=>byPart(p).length>=OFFICIAL[p])){toast('完整模拟需要各 Part 数量达到正式考试配比，请先更新题库');break;}startSession('mock',mockQuestions(true),120*60);break;}
  case 'answer':answerQuestion(Number(el.dataset.index));break;
  case 'next':nextQuestion();break;
  case 'jump':if(session){session.index=Number(el.dataset.index);session.transcript=false;render();window.scrollTo({top:0,behavior:'instant'});}break;
  case 'play-audio':if(session){const q=session.items[session.index];speak(audioText(q));}break;
  case 'toggle-transcript':if(session){session.transcript=!session.transcript;render();}break;
  case 'bookmark':if(session){const id=session.items[session.index].id;state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();render();}break;
  case 'submit-mock':if(session?.mode==='mock'&&confirm('确定提交模拟试卷吗？未作答题目按错误计算。'))finishSession();break;
  case 'exit-session':if(confirm('要结束本次练习吗？未提交的模拟卷不会记录成绩。')){clearInterval(timerInterval);if('speechSynthesis'in window)window.speechSynthesis.cancel();session=null;result=null;render();}break;
  case 'retry-session':{if(result){const old=result;result=null;startSession(old.mode==='wrong'?'wrong':old.mode,randSort(old.parts.map(r=>r.q)),old.mode==='mock'?20*60:0);}break;}
  case 'start-wrong':{const arr=state.wrong.map(id=>allQuestions.find(q=>q.id===id)).filter(Boolean);startSession('wrong',arr);break;}
  case 'review-one':{const q=allQuestions.find(v=>v.id===el.dataset.id);if(q)startSession('wrong',[q]);break;}
  case 'flip-word':isWordFlipped=!isWordFlipped;render();break;
  case 'word-again':gradeWord(false);break;
  case 'word-know':gradeWord(true);break;
  case 'speak-word':if(wordQueue.length){const w=wordQueue[currentWordIndex%wordQueue.length];speak(w.word+'. '+w.example);}break;
  case 'refresh-bank':refreshBank(false);break;
  case 'import-bank':$('#import-questions')?.click();break;
  case 'download-example':{const example={version:'2026-11-21',questions:[{id:'my-custom-001',part:5,question:'The office will reopen _____ Monday.',options:['on','at','with','of'],answer:0,explanation:'在星期几之前用介词 on。',stimulus:'',difficulty:'基础',topic:'介词'}]};download('toeic-question-format.json',JSON.stringify(example,null,2));break;}
  case 'export-progress':{const backup={app:'toeic-studio',exportedAt:new Date().toISOString(),data:{...state,remoteQuestions:[],manualQuestions:[]}};download('toeic-study-backup-'+dateKey()+'.json',JSON.stringify(backup,null,2));toast('学习进度备份已生成');break;}
  case 'import-progress-btn':$('#import-progress')?.click();break;
  case 'save-settings':saveSettings();break;
  case 'clear-progress':if(confirm('确定清空累计答题、错题和词汇复习记录吗？此操作不可撤销，建议先导出备份。')){state.history=[];state.wrong=[];state.bookmarks=[];state.wordReview={};save();initVocab();render();toast('学习记录已清空，题库内容保留。');}break;
  default:break;
 }
}
document.addEventListener('click',event=>{const navEl=event.target.closest('[data-nav]');if(navEl){event.preventDefault();showView(navEl.dataset.nav);return;}const actionEl=event.target.closest('[data-action]');if(actionEl){event.preventDefault();onAction(actionEl.dataset.action,actionEl);}});
document.addEventListener('change',async event=>{const el=event.target;
 if(el.dataset.change==='question-count'){state.sessionCount=Number(el.value)||10;save();}
 if(el.dataset.change==='bank-url'){state.updateUrl=el.value.trim()||'./data/updates.json';save();toast('更新地址已保存');}
 if(el.id==='import-questions'){try{const json=await readJSON(el.files?.[0]);if(!json)return;const summary=importQuestions(json);toast(`导入完成：新增 ${summary.added} 题；重复 ${summary.dup}；无效 ${summary.invalid}`);render();}catch(e){toast('导入失败：'+e.message);}finally{el.value='';}}
 if(el.id==='import-progress'){try{const json=await readJSON(el.files?.[0]);if(!json)return;const data=json.data;if(json.app!=='toeic-studio'||!data||!Array.isArray(data.history)||!Array.isArray(data.wrong))throw new Error('不是有效的 TOEIC Studio 学习备份');if(confirm('导入会覆盖当前的答题与词汇复习记录，确定继续？')){state={...state,history:data.history.slice(-15000),wrong:data.wrong,bookmarks:Array.isArray(data.bookmarks)?data.bookmarks:[],wordReview:data.wordReview||{},goal:data.goal||800,examDate:data.examDate||''};save();initVocab();render();toast('学习备份已恢复');}}catch(e){toast('恢复失败：'+e.message);}finally{el.value='';}}
});
document.addEventListener('keydown',e=>{if(!session||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')||e.ctrlKey||e.altKey||e.metaKey)return;const i='abcd'.indexOf(e.key.toLowerCase());if(i>=0&&i<session.items[session.index].options.length){e.preventDefault();answerQuestion(i);}else if(e.key==='Enter'&&session.mode!=='mock'&&session.submitted[session.items[session.index].id]){e.preventDefault();nextQuestion();}});
$('#mobile-menu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#mobile-backdrop').classList.add('show');});
$('#mobile-backdrop').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobile-backdrop').classList.remove('show');});
window.addEventListener('hashchange',()=>nav(location.hash.slice(1)||'dashboard'));
window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel();});
// Restore current user-selected page, then check for new publisher-provided questions.
nav(location.hash.slice(1)||'dashboard');
if(location.protocol!=='file:'){setTimeout(()=>refreshBank(true),900);setInterval(()=>refreshBank(true),6*60*60*1000);}
})();
